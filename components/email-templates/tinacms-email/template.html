<!DOCTYPE html>
<html
  lang="en"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>{{TITLE}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style type="text/css">
      /* Tokens mirror the tina.io Tailwind theme (--brand-*, --neutral-*). */
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
        --brand-primary: #ec4815;
        --brand-primary-hover: #d13f13;
        --brand-primary-light: #ffd3c1;
        --brand-primary-text: #d13f13;
        --brand-primary-contrast: #7a230b;
        --brand-primary-gradient-start: #ff724b;
        --brand-primary-gradient-end: #d13f13;
        --neutral-background: #f8fafc;
        --neutral-surface: #faebe5;
        --neutral-border: #cbd5e1;
        --neutral-border-subtle: #e2e8f0;
        --color-white: #ffffff;
      }

      body,
      table,
      td,
      a {
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      table,
      td {
        mso-table-rspace: 0pt;
        mso-table-lspace: 0pt;
      }

      table {
        border-collapse: collapse !important;
      }

      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }

      body {
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      a[x-apple-data-detectors] {
        color: inherit !important;
        font-family: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
        text-decoration: none !important;
      }
      .email-callout { border-radius: 12px !important; border-collapse: separate !important; border-spacing: 0; overflow: hidden !important; }
      @media (prefers-color-scheme: dark) {
        body, .email-bg {
          background-color: #111827 !important;
          background-image: url("{{BACKGROUND_DARK_URL}}"), linear-gradient(135deg, #111827 0%, #1f2937 52%, #241748 100%) !important;
          background-position: center top !important;
          background-repeat: no-repeat !important;
          background-size: cover !important;
        }
        .email-card {
          background-color: #1f2937 !important;
          background-image: linear-gradient(180deg, #1f2937 0%, #18212f 100%) !important;
        }
        .email-copy, .email-card td[style*="color: #30364d"] { color: #e5e7eb !important; }
        .email-heading { color: #d13f13 !important; background-image: linear-gradient(135deg, #ff724b 0%, #d13f13 100%) !important; -webkit-background-clip: text !important; background-clip: text !important; -webkit-text-fill-color: transparent !important; }
        .email-callout {
          background-color: #34251f !important;
          background-image: linear-gradient(135deg, #34251f 0%, #2b211e 100%) !important;
          border-color: #75412f !important;
        }
        .email-callout td { color: #f3e8e2 !important; }
        .email-link { color: #ff9a69 !important; }
        .email-footer { background-color: var(--brand-primary) !important; background-image: linear-gradient(135deg, var(--brand-primary-gradient-start) 0%, var(--brand-primary) 100%) !important; border-color: var(--brand-primary-hover) !important; border-radius: 12px !important; border-collapse: separate !important; overflow: hidden !important; }
        .email-footer td { color: var(--color-white) !important; }
        .email-footer p { color: var(--color-white) !important; }
        .email-footer a { color: var(--color-white) !important; }
        .email-video { background-color: #374151 !important; }
      }
      [data-ogsc] .email-bg { background-color: #111827 !important; background-image: url("{{BACKGROUND_DARK_URL}}"), linear-gradient(135deg, #111827 0%, #1f2937 52%, #241748 100%) !important; background-position: center top !important; background-repeat: no-repeat !important; background-size: cover !important; }
      [data-ogsc] .email-card { background-color: #1f2937 !important; }
      [data-ogsc] .email-copy, [data-ogsc] .email-card td[style*="color: #30364d"] { color: #e5e7eb !important; }
      [data-ogsc] .email-heading { color: #d13f13 !important; background-image: linear-gradient(135deg, #ff724b 0%, #d13f13 100%) !important; -webkit-background-clip: text !important; background-clip: text !important; -webkit-text-fill-color: transparent !important; }
      [data-ogsc] .email-callout { background-color: #34251f !important; border-color: #75412f !important; }
      [data-ogsc] .email-callout td { color: #f3e8e2 !important; }
      [data-ogsc] .email-link { color: #ff9a69 !important; }
      [data-ogsc] .email-footer { background-color: var(--brand-primary) !important; background-image: linear-gradient(135deg, var(--brand-primary-gradient-start) 0%, var(--brand-primary) 100%) !important; border-color: var(--brand-primary-hover) !important; border-radius: 12px !important; border-collapse: separate !important; overflow: hidden !important; }
      [data-ogsc] .email-footer td, [data-ogsc] .email-footer p { color: var(--color-white) !important; }
      [data-ogsc] .email-footer a { color: var(--color-white) !important; }
      [data-ogsc] .email-video { background-color: #374151 !important; }
    </style>
  </head>
  <body class="email-bg" style="margin: 0; padding: 0; background-color: #f8fafc; background-image: url('{{BACKGROUND_LIGHT_URL}}'), linear-gradient(135deg, #fff7ed 0%, #f8fafc 48%, #eef2ff 100%); background-position: center top, center; background-repeat: no-repeat, no-repeat; background-size: cover, cover">
    <div
      style="
        display: none;
        max-width: 0;
        max-height: 0;
        overflow: hidden;
        font-size: 1px;
        line-height: 1px;
        color: #ffffff;
        opacity: 0;
      "
    >
      {{PREHEADER}}
    </div>

    <table
      role="presentation"
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      class="email-bg"
      style="background-color: #f8fafc; background-image: url('{{BACKGROUND_LIGHT_URL}}'), linear-gradient(135deg, #fff7ed 0%, #f8fafc 48%, #eef2ff 100%); background-position: center top, center; background-repeat: no-repeat, no-repeat; background-size: cover, cover"
    >
      <tr>
        <td align="center" style="padding: 32px 20px 20px">
          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="max-width: 600px"
          >
            <tr>
              <td align="left">
                <a
                  href="https://tina.io"
                  target="_blank"
                  style="display: inline-block"
                >
                  <img
                    src="https://assets.tina.io/06bcd49e-f919-4e53-a2c4-77f656491c7d/img/tinacms-logo.png"
                    alt="TinaCMS"
                    width="250"
                    height="47"
                    style="display: block; width: 250px; height: 47px"
                  />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td align="center" style="padding: 0 20px">
          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            class="email-card"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 7px;
              overflow: hidden;
            "
          >
                        <!-- BODY:START -->
            <!-- BLOCK: heading (required). Replace {{HEADING}}. Sentence case, six words or fewer. -->
            <tr>
              <td
                align="left"
                style="
                  padding: 36px 32px 12px;
                  font-family: 'Inter', Helvetica, Arial, sans-serif;
                "
              >
                <h1 class="email-heading"
                  style="
                    margin: 0;
                    color: #d13f13;
                    background-image: linear-gradient(135deg, #ff724b 0%, #d13f13 100%);
                    -webkit-background-clip: text;
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                    font-size: 30px;
                    font-weight: 700;
                    letter-spacing: -0.5px;
                    line-height: 38px;
                    font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif;
                  "
                >
                  {{HEADING}}
                </h1>
              </td>
            </tr>

            <!-- BLOCK: body copy (required). Replace {{BODY_HTML}} with two or three <p> elements. Use style="margin: 0 0 18px" on each <p> except the last, which uses style="margin: 0". Each paragraph: under 60 words. -->
            <tr>
              <td
                align="left"
                class="email-copy"
                style="
                  padding: 4px 32px 8px;
                  color: #30364d;
                  font-family: 'Inter', Helvetica, Arial, sans-serif;
                  font-size: 17px;
                  line-height: 28px;
                "
              >
                {{BODY_HTML}}
              </td>
            </tr>

            <!-- BLOCK: primary button (optional). Delete this row if the email has no action. Label: one to four words, verb first. -->
            <tr>
              <td align="center" style="padding: 18px 32px 24px">
                <table
                  role="presentation"
                  border="0"
                  cellpadding="0"
                  cellspacing="0" align="center"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#d13f13"
                      style="border-radius: 6px; background-color: #d13f13; background-image: linear-gradient(135deg, #ff724b 0%, #d13f13 100%)"
                    >
                      <a
                        href="{{CTA_URL}}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 14px 24px;
                          color: #ffffff;
                          font-family: 'Inter', Helvetica, Arial, sans-serif;
                          font-size: 19px;
                          font-weight: 700;
                          line-height: 24px;
                          text-decoration: none;
                        "
                      >
                        {{CTA_LABEL}}
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- BLOCK: callout (optional). Delete this row if the email has no note. Replace {{CALLOUT_HTML}} with one short <strong> label and a sentence. -->
            <tr>
              <td align="left" style="padding: 0 32px 24px">
                <table
                  role="presentation"
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                  class="email-callout" bgcolor="#fff3ed"
                  style="
                    background-color: #fff3ed;
                    background-image: linear-gradient(135deg, #fff7ed 0%, #fff3ed 100%);
                    border: 1px solid #ffd3c1;
                    border-radius: 12px;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 18px 20px;
                        color: #7a230b;
                        font-family: 'Inter', Helvetica, Arial,
                          sans-serif;
                        font-size: 16px;
                        line-height: 25px;
                      "
                    >
                      {{CALLOUT_HTML}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- BLOCK: video (optional). Delete this row and the link row below if the email has no video. The poster is a 536 x 301 JPG or PNG. -->
            <tr>
              <td align="center" style="padding: 0 32px 24px">
                <a
                  href="{{VIDEO_URL}}"
                  target="_blank"
                  aria-label="{{VIDEO_LABEL}}"
                  style="display: block"
                >
                  <img
                    src="{{VIDEO_POSTER_URL}}"
                    alt="{{VIDEO_LABEL}}"
                    width="536"
                    style="display: block; width: 100%; max-width: 536px; height: auto; border-radius: 6px"
                  />
                </a>
              </td>
            </tr>

            <!-- BLOCK: sign-off (required). Replace {{SIGN_OFF}} with the closing line and {{SIGNATURE}} with the sign-off name. -->
            <tr>
              <td
                align="left"
                style="
                  padding: 4px 32px 36px;
                  color: #30364d;
                  font-family: 'Inter', Helvetica, Arial, sans-serif;
                  font-size: 17px;
                  line-height: 28px;
                "
              >
                <p style="margin: 0">
                  {{SIGN_OFF}}<br />
                  <strong>{{SIGNATURE}}</strong>
                </p>
              </td>
            </tr>
            <!-- BODY:END -->
          </table>
        </td>
      </tr>

      <tr>
        <td align="center" style="padding: 16px 20px 0">
          <table class="email-footer" role="presentation" bgcolor="#ec4815" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ec4815; background-image: linear-gradient(135deg, #ff724b 0%, #ec4815 100%); border: 1px solid #d13f13; border-radius: 12px; border-collapse: separate !important; border-spacing: 0; overflow: hidden">
            <tr>
                        <td role="contentinfo" align="center" style="padding: 24px 24px 22px; color: #ffffff; font-family: 'Inter', Helvetica, Arial, sans-serif; font-size: 15px; line-height: 24px">
            <p style="margin: 0 0 10px">
              <a href="https://tina.io" target="_blank" style="display: inline-block; text-decoration: none">
                <img src="{{FOOTER_LOGO_URL}}" alt="TinaCMS home" width="150" style="display: block; width: 150px; max-width: 100%; height: auto; border: 0" />
              </a>
            </p>
            <h2 style="margin: 0 0 8px; color: #ffffff; font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; line-height: 28px">Stay in touch with TinaCMS</h2>            <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto 14px">
              <tr>
                <td align="center" style="padding: 0 8px"><a href="https://github.com/tinacms/tinacms" target="_blank" style="display: inline-block"><img src="https://tina.io/github-mark-white.svg" alt="GitHub" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://discord.com/invite/zumN63Ybpf" target="_blank" style="display: inline-block"><img src="https://tina.io/icon_clyde_white_RGB.svg" alt="Discord" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://twitter.com/tinacms" target="_blank" style="display: inline-block"><img src="https://tina.io/logo.svg" alt="Twitter" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://www.linkedin.com/company/tinacms" target="_blank" style="display: inline-block"><img src="https://tina.io/LinkedIn_icon-white1.svg" alt="LinkedIn" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://www.facebook.com/tinacms/" target="_blank" style="display: inline-block"><img src="{{FACEBOOK_ICON_URL}}" alt="Facebook" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://www.youtube.com/@TinaCMS" target="_blank" style="display: inline-block"><img src="https://tina.io/youtube-logo-white1.svg" alt="YouTube" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://bsky.app/profile/tina.io" target="_blank" style="display: inline-block"><img src="https://tina.io/svg/bluesky-logo.svg" alt="Bluesky" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://www.instagram.com/tinacms_/" target="_blank" style="display: inline-block"><img src="https://tina.io/svg/instagram-logo.svg" alt="Instagram" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
                <td align="center" style="padding: 0 8px"><a href="https://www.threads.com/@tinacms_" target="_blank" style="display: inline-block"><img src="{{THREADS_ICON_URL}}" alt="Threads" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0" /></a></td>
              </tr>
            </table>
            <p style="margin: 0 0 12px">{{SUPPORT_LINE}} or <a href="{{SUPPORT_URL}}" target="_blank" style="color: #ffffff; text-decoration: underline">{{SUPPORT_LINK_LABEL}}</a>.</p>
            <p style="margin: 0; color: #ffffff; font-size: 12px; line-height: 18px">{{FOOTER_LEGAL_LINE}}<br />&copy; 2026 TinaCMS. All rights reserved.</p>
          </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td height="36" style="height: 36px; line-height: 36px">&nbsp;</td>
      </tr>
    </table>
  </body>
</html>
